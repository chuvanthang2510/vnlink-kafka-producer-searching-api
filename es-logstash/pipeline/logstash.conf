input {
  kafka {
    bootstrap_servers => "localhost:9092"
    topics            => ["thangchuvan1"]
    codec             => json {
      charset => "UTF-8"
    }
    group_id          => "logstash-viettel-logs"
    auto_offset_reset => "earliest"
  }
}

filter {
  # Chỉ xử lý bản ghi không bị lỗi parse JSON
  if "_jsonparsefailure" not in [tags] {

    # Chuyển đổi timestamp thành event_time theo định dạng của bạn
    if [timestamp] {
      date {
        match    => ["timestamp", "dd/MM/yyyy HH:mm:ss", "ISO8601"]
        target   => "event_time"
        timezone => "Asia/Ho_Chi_Minh"
      }
    }

    # Gán log_date là thời điểm hiện tại (tức là @timestamp)
    mutate {
      add_field => {
        "log_date" => "%{@timestamp}"
      }
    }

    # Gán document_id nếu có request_id
    if [extra_data][request_id] {
      mutate {
        add_field => {
          "[@metadata][document_id]" => "%{[extra_data][request_id]}"
        }
      }
    } else {
      ruby {
        code => '
          require "securerandom"
          event.set("[@metadata][document_id]", SecureRandom.uuid)
        '
      }
    }

    # Gán tên index theo event_time (tháng) → logs-YYYY.MM
    ruby {
      code => '
        if event.get("event_time")
          t = LogStash::Timestamp.coerce(event.get("event_time"))
          event.set("[@metadata][index_name]", "logs-" + t.time.strftime("%Y.%m"))
        else
          # fallback nếu không có event_time → dùng @timestamp
          t = event.get("@timestamp")
          event.set("[@metadata][index_name]", "logs-" + t.time.strftime("%Y.%m"))
        end
      '
    }

    # Xoá các trường không cần thiết
    mutate {
      remove_field => ["@version", "host", "agent", "input", "ecs", "log", "event", "tags"]
    }
  }
}

output {
  # Ghi log lỗi nếu JSON bị lỗi
  if "_jsonparsefailure" in [tags] {
    file {
      path  => "/var/log/logstash/json_parse_errors.log"
      codec => line
    }
  } else {
    # Đẩy vào Elasticsearch
    elasticsearch {
      hosts         => ["http://103.21.149.190:9200"]
      index         => "%{[@metadata][index_name]}"
      document_id   => "%{[@metadata][document_id]}"
      action        => "update"
      doc_as_upsert => true
      user          => "elastic"
      password      => "M6a5K2XgHhWJYAZUsGF4mRc"
    }

    # In ra stdout để debug
    stdout {
      codec => rubydebug {
        metadata => true
      }
    }
  }
}
